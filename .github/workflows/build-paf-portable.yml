name: Build MarkText PAF-Compatible Windows x64

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Optional MarkText fork (blank uses your-account/marktext)
        required: false
        default: ''
        type: string
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: 'develop'
        type: string

permissions:
  contents: read

# Independent from both the regular MarkText build and the old test workflow.
concurrency:
  group: marktext-paf-build
  cancel-in-progress: false

jobs:
  build:
    name: PAF-compatible Windows x64 application ZIP
    runs-on: windows-2022
    timeout-minutes: 110

    steps:
      - name: Checkout existing MarkText portable-builder repository
        uses: actions/checkout@v4

      - name: Resolve clean MarkText source
        id: source
        shell: pwsh
        env:
          REQUEST_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $repo = $env:REQUEST_REPOSITORY.Trim()
          if ([string]::IsNullOrWhiteSpace($repo)) {
            $repo = '${{ github.repository_owner }}/marktext'
          }
          if ($repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Invalid source repository: $repo"
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REF)) {
            throw 'Source branch/tag/SHA cannot be blank'
          }
          "repository=$repo" >> $env:GITHUB_OUTPUT
          "ref=$env:SOURCE_REF" >> $env:GITHUB_OUTPUT
          Write-Host "Source: $repo @ $env:SOURCE_REF"

      - name: Checkout clean MarkText fork
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: source
          fetch-depth: 1

      - name: Record source revision
        id: revision
        shell: pwsh
        run: |
          $sha = (git -C source rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "MarkText source revision: $sha"

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Apply proven v1.1 portable-path patch
        shell: pwsh
        run: |
          python scripts/patch_marktext_portable.py --root source
          if ($LASTEXITCODE -ne 0) { throw 'Existing v1.1 portable path patch failed' }
          # This check must run before removal of crashReporter.start() calls:
          # v1.1 verification expects the original reporter call to exist.
          python scripts/verify_marktext_source.py --root source --output build-report/v11-portable-paths.txt
          if ($LASTEXITCODE -ne 0) { throw 'Existing v1.1 source verification failed' }

      - name: Apply successful v1.2.3 two-start Crashpad isolation fix
        shell: pwsh
        run: |
          python scripts/Disable-Crashpad-For-Test.py --root source
          if ($LASTEXITCODE -ne 0) { throw 'The tested two-start Crashpad patch failed' }
          python scripts/Verify-Crashpad-Isolation-Source.py --root source --output build-report/crashpad-isolation.txt
          if ($LASTEXITCODE -ne 0) { throw 'Crashpad isolation source verification failed' }

      - name: Verify PAF compatibility before building
        shell: pwsh
        run: |
          python scripts/Verify-MarkText-PAF-Source.py --root source --output build-report/paf-source-verification.txt
          if ($LASTEXITCODE -ne 0) { throw 'PAF source verification failed' }

      - name: Install upstream dependencies
        working-directory: source
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }

      - name: Build Windows x64 ZIP using upstream build command
        working-directory: source
        shell: pwsh
        run: |
          pnpm run build:win:x64
          if ($LASTEXITCODE -ne 0) { throw 'MarkText Windows build failed' }

      - name: Assemble application binary for PortableApps
        shell: pwsh
        run: |
          & .\scripts\Assemble-MarkText-PAF.ps1 `
            -SourceRoot "$PWD\source" `
            -BuilderRoot "$PWD" `
            -OutputRoot "$PWD\release"
          if (-not $?) { throw 'PAF application assembly failed' }

      - name: Upload PAF-compatible binary ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MarkText-PAF-Binary-Windows-x64-${{ steps.revision.outputs.sha }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload patch and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkText-PAF-Build-Diagnostics-${{ github.run_id }}
          path: build-report/**
          if-no-files-found: warn
          retention-days: 30
